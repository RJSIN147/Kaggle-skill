# The kaggle-exp skill package. `uv sync --project <skill dir>` installs the `kx`
# CLI and the pinned `kaggle` package (CLI + kagglesdk) into the skill's own
# locked environment; the AI then runs `uv run --project <skill dir> kx ...`
# from the competition workspace.

[project]
name = "kaggle-exp"
version = "0.4.0"
description = "Kaggle competition research loop for Claude Code: one kx CLI, kernel-first runs, validation diagnosis, fold-paired comparisons, a git-backed ledger."
requires-python = ">=3.11"
dependencies = [
    # Exact pin: every Kaggle call kx makes was verified live against 2.2.3.
    "kaggle==2.2.3",
]

[project.optional-dependencies]
# Local runs (`kx new --local`): the ML stack the tabular/time-series templates import.
local = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "pyarrow>=15",
]

[project.scripts]
kx = "kx.cli:main"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "kx"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
# Envelope strings and test assertions run long on purpose; E501 is not enforced.
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: real Kaggle calls (excluded by default; run with -m live)"]
